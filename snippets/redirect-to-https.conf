# Port-80 server body: ACME challenges + permanent redirect to HTTPS.
#
# Usage (one line per site, next to its server_name):
#   server {
#       server_name             example.com www.example.com;
#       include                 snippets/redirect-to-https.conf;
#   }
#
# Redirects to $host (the name the client asked for), not $server_name, which
# is always the FIRST name in server_name — with several names, $server_name
# would send www./api./admin. visitors to the wrong host.

listen                  80;
listen                  [::]:80;

include                 snippets/letsencrypt.conf;

location / {
    return              301 https://$host$request_uri;
}
