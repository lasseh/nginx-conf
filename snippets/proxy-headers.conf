# Standard proxy headers for reverse proxy configurations
# Include this file in every location that proxies to a backend. It covers
# plain HTTP and WebSocket alike (see the maps in conf.d/maps.conf), and keeps
# upstream keepalive working. Don't repeat any of these proxy_set_header lines
# in the location: nginx sends both copies upstream.

proxy_set_header    Host $host;
proxy_set_header    X-Real-IP $remote_addr;
proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header    X-Forwarded-Proto $scheme;
proxy_set_header    X-Forwarded-Host $host;
proxy_set_header    X-Request-ID $request_id;

# WebSocket upgrade when the client asks for one; empty (= keepalive) otherwise
proxy_set_header    Upgrade $proxy_upgrade;
proxy_set_header    Connection $connection_upgrade;
