# =============================================================================
# ERROR PAGES CONFIGURATION
# =============================================================================
# Custom HTML error pages served from html/errors/
# Include this snippet in server blocks for user-friendly error responses
#
# Usage: include snippets/error-pages.conf;
#
# NOTE: error_page only handles errors nginx generates itself (missing static
# file, dead upstream, etc). For errors returned by a backend you must opt in,
# or the backend's own response body is passed straight through:
#   proxy_intercept_errors on;     # in proxied (proxy_pass) locations
#   fastcgi_intercept_errors on;   # in PHP-FPM / FastCGI locations
#
# NOTE: 503 is intentionally omitted here so it doesn't clash with a
# maintenance-mode handler (e.g. error_page 503 @maintenance) defined in the
# vhost. Add `error_page 503 /503.html;` to the server block if you want the
# generic 503 page and aren't using a custom maintenance handler.
#
# For API/JSON error responses, use snippets/error-pages-json.conf instead.

# Error page directives
error_page 404 /404.html;
error_page 500 /500.html;
error_page 502 /502.html;
error_page 504 /504.html;

# Serve error pages from html/errors directory
location = /404.html {
    root /etc/nginx/html/errors;
    internal;
}

location = /500.html {
    root /etc/nginx/html/errors;
    internal;
}

location = /502.html {
    root /etc/nginx/html/errors;
    internal;
}

location = /503.html {
    root /etc/nginx/html/errors;
    internal;
}

location = /504.html {
    root /etc/nginx/html/errors;
    internal;
}
