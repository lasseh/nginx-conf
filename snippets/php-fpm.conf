# PHP-FPM configuration snippet
# Standard configuration for PHP processing
#
# IMPORTANT: Update the PHP version in fastcgi_pass to match your installation.
# Common socket paths:
#   php8.1-fpm.sock | php8.2-fpm.sock | php8.3-fpm.sock | php8.4-fpm.sock
# Check installed version: php -v
# Check socket path:      ls /var/run/php/

location ~ \.php$ {
    try_files $uri =404;

    # Let nginx serve the custom pages from snippets/error-pages.conf for errors
    # returned by PHP (404, 500, ...). Off by default because frameworks like
    # Laravel/Symfony render their own error pages; enable only for plain PHP
    # apps that should fall back to the generic pages.
    #fastcgi_intercept_errors on;

    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;  # Adjust PHP version as needed
    fastcgi_index index.php;
    
    include conf.d/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    
    # Security
    fastcgi_param HTTP_PROXY "";
    
    # Timeouts
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout 60s;
    fastcgi_read_timeout 60s;
    
    # Buffer sizes
    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 256k;
    fastcgi_busy_buffers_size 256k;
}