# Static file serving optimization
# Efficient handling of static assets with proper caching
# Server-level security headers still apply here via conf.d/headers.conf
# (add_header_inherit merge), so these locations only add caching headers.

# Images
location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# CSS and JavaScript
location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Web fonts
location ~* \.(woff|woff2|ttf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;

    # CORS for web fonts
    add_header Access-Control-Allow-Origin *;
}

# Documents
location ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx)$ {
    add_header Cache-Control "public, max-age=86400, no-transform";
}

# Media files
location ~* \.(mp4|mp3|webm|ogg|wav|flac)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}