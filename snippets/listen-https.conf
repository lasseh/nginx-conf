# HTTPS server preamble: TLS + HTTP/2 + HTTP/3 (QUIC) on 443, IPv4 and IPv6,
# plus the Alt-Svc header that advertises HTTP/3 (snippets/http3.conf).
#
# Usage (server level, one line replaces the listen/http2/http3 block):
#   server {
#       include                 snippets/listen-https.conf;
#       server_name             example.com;
#       ssl_certificate         /etc/letsencrypt/live/example.com/fullchain.pem;
#       ssl_certificate_key     /etc/letsencrypt/live/example.com/privkey.pem;
#       ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;
#       include                 snippets/security-headers.conf;   # or sites-security/<domain>.conf
#       include                 snippets/deny-files.conf;
#       ...
#   }
#
# No `reuseport` here: nginx allows it on only one server per address:port,
# and sites-available/defaults-443.conf (the default_server) carries it.

listen                  443 ssl;
listen                  443 quic;
listen                  [::]:443 ssl;
listen                  [::]:443 quic;
http2                   on;
http3                   on;

include                 snippets/http3.conf;
