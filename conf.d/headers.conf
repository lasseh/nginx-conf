# =============================================================================
# RESPONSE HEADER INHERITANCE
# =============================================================================
# By default nginx drops EVERY inherited add_header as soon as a location (or
# an `if` inside one) sets its own. One Cache-Control line then silently strips
# HSTS, CSP, Alt-Svc and CORS from that location's responses.
#
# `merge` makes each level append to its parent's headers instead, so:
#   - server-level headers (security-headers, sites-security, http3 Alt-Svc,
#     CORS) reach every location and `if` block automatically
#   - locations only add what is specific to them (Cache-Control, Vary, ...)
#
# Rules that follow from this:
#   - never re-include snippets/security-headers.conf inside a location; with
#     merge that sends every security header twice
#   - set a given header name at ONE level only; a name set at both server and
#     location level is sent twice
#   - a location that must NOT inherit can opt out with `add_header_inherit off;`
#
# Requires nginx >= 1.29.3 (mainline). Older builds fail `nginx -t` with
# 'unknown directive "add_header_inherit"'.

add_header_inherit         merge;
