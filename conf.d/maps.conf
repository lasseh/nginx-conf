# =============================================================================
# NGINX MAP BLOCKS
# =============================================================================
# Global variable mappings used throughout the configuration
# These maps are processed at http level and available to all server blocks

# =============================================================================
# WEBSOCKET CONNECTION UPGRADE MAPPING
# =============================================================================
# Used by snippets/proxy-headers.conf in every proxied location, so any
# location can carry a WebSocket handshake (RFC 6455) without extra config.
#
# - WebSocket handshake: forward "Upgrade: websocket" + "Connection: upgrade"
# - Anything else: both empty, so nginx sends neither header. An empty
#   Connection is what lets upstream `keepalive` pools reuse connections;
#   the old "close" value made every upstream request a new connection.
# - Other Upgrade values (e.g. h2c) are dropped rather than forwarded, which
#   blocks h2c request smuggling through the proxy.
map $http_upgrade $proxy_upgrade {
    default          "";
    ~*^websocket$    websocket;
}

map $http_upgrade $connection_upgrade {
    default          "";
    ~*^websocket$    upgrade;
}

# =============================================================================
# WEBSOCKET CLIENT IP FORWARDING (RFC 7239 COMPLIANT)
# =============================================================================
# Format client IP addresses for RFC 7239 Forwarded header
# Handles IPv4, IPv6, and Unix domain sockets correctly
map $remote_addr $proxy_forwarded_elem {
    # IPv4 addresses (standard format)
    ~^[0-9.]+$        "for=$remote_addr";

    # IPv6 addresses (bracketed and quoted per RFC 7239)
    ~^[0-9A-Fa-f:.]+$ "for=\"[$remote_addr]\"";

    # Unix domain sockets (cannot be represented in RFC 7239)
    default           "for=unknown";
}
