# =============================================================================
# CLOUDFLARE — REAL CLIENT IP RECOVERY
# =============================================================================
# Behind Cloudflare the socket peer is an edge PoP, not the visitor. Everything
# that reads $remote_addr is then wrong in the same silent way: the elk_json
# access log (and so every Grafana/Loki panel built on it), limit_req/limit_conn
# buckets, allow/deny rules, fail2ban, and X-Real-IP / X-Forwarded-For as set by
# snippets/proxy-headers.conf — backends see the PoP and attribute every visitor
# to it.
#
# real_ip_header rewrites $remote_addr in the POST_READ phase, which runs before
# limit_req (PREACCESS) and before logging, so enabling this fixes all of the
# above at once and no site config has to change.
#
# Safe to load globally, including on hosts that serve non-Cloudflare sites: the
# rewrite only applies to peers inside the ranges below. A direct visitor is not
# in them, keeps its own address, and CANNOT spoof CF-Connecting-IP. Requests
# arriving through Cloudflare cannot spoof it either — the edge overwrites the
# header it sets. A stale range list also fails safe: an unlisted edge simply
# leaves $remote_addr as the PoP, which is the pre-existing behaviour.
#
# real_ip_recursive is deliberately left at its default (off): CF-Connecting-IP
# is a single address the edge sets itself, not an appended chain.
#
# Ranges are Cloudflare's published list, verified 2026-08-13:
#     curl https://www.cloudflare.com/ips-v4
#     curl https://www.cloudflare.com/ips-v6
# They change on a multi-year cadence — re-fetch when Cloudflare announces a
# change rather than on a schedule.
# =============================================================================

# IPv4 ranges
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6 ranges
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
