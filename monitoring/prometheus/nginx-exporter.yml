# =============================================================================
# NGINX PROMETHEUS EXPORTER - DOCKER COMPOSE
# =============================================================================
# This exports nginx metrics to Prometheus for monitoring and alerting
#
# Installation:
#   1. Install Docker and Docker Compose
#   2. cd monitoring/prometheus
#   3. docker-compose up -d
#
# Access:
#   - Exporter metrics: http://localhost:9113/metrics
#   - Nginx stub_status: http://localhost/nginx-status (localhost only)
#
# =============================================================================

services:
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-prometheus-exporter
    restart: unless-stopped

    # Host networking: the exporter reaches stub_status on 127.0.0.1, which is
    # the only address snippets/stub-status.conf allows. From a bridge network
    # the request would come from the Docker gateway IP and get a 403.
    # The exporter listens on the host's :9113 directly (no ports: mapping).
    network_mode: host

    # Command line arguments (exporter v1+ uses --double-dash flags)
    command:
      - '--nginx.scrape-uri=http://127.0.0.1/nginx-status'
      # For custom stub_status location:
      # - '--nginx.scrape-uri=http://127.0.0.1/custom-status'

      # SSL/TLS options (if stub_status is behind HTTPS):
      # - '--no-nginx.ssl-verify'
      # - '--nginx.ssl-ca-cert=/etc/ssl/certs/ca.pem'
      # - '--nginx.ssl-client-cert=/etc/ssl/certs/client.pem'
      # - '--nginx.ssl-client-key=/etc/ssl/private/client-key.pem'

      # Timeout for scraping nginx
      - '--nginx.timeout=5s'

    # No healthcheck: the image has no shell or wget. Prometheus' `up` for
    # job="nginx" and the exporter's own nginx_up metric cover it.

    # Resources
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# ALTERNATIVE: NATIVE INSTALLATION (WITHOUT DOCKER)
# =============================================================================
# If you prefer to run the exporter natively:
#
# 1. Download binary:
#    Get the latest linux tarball from
#    https://github.com/nginx/nginx-prometheus-exporter/releases/latest
#    tar xzf nginx-prometheus-exporter_*_linux_amd64.tar.gz
#    sudo mv nginx-prometheus-exporter /usr/local/bin/
#
# 2. Create systemd service:
#    sudo nano /etc/systemd/system/nginx-exporter.service
#
# [Unit]
# Description=NGINX Prometheus Exporter
# After=network.target
#
# [Service]
# Type=simple
# User=nginx-exporter
# ExecStart=/usr/local/bin/nginx-prometheus-exporter \
#   --nginx.scrape-uri=http://127.0.0.1/nginx-status \
#   --web.listen-address=:9113
# Restart=always
#
# [Install]
# WantedBy=multi-user.target
#
# 3. Start service:
#    sudo systemctl daemon-reload
#    sudo systemctl enable nginx-exporter
#    sudo systemctl start nginx-exporter
#
# =============================================================================
