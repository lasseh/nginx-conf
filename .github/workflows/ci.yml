name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every image in the tests is a rolling tag (nginx:mainline, alloy:latest,
  # ...), so a new upstream release can break the configs with no commit here.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make lint

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner's apt nginx is older than the 1.29.3 the configs require.
      - run: make validate-docker

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-runtime
