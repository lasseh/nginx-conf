# Security headers for example-site.com
# This file contains site-specific security configurations

# Standard security headers
add_header X-XSS-Protection        "0" always;
add_header X-Content-Type-Options  "nosniff" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
add_header X-Frame-Options         "SAMEORIGIN" always;  # Fallback for older browsers; CSP frame-ancestors takes precedence
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Modern security headers
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;  # "require-corp" breaks third-party resources (Google Fonts, jsDelivr, etc.)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content Security Policy - customize for your site's needs
# This is a balanced CSP that allows common use cases while maintaining security
# CSP must be a single line — HTTP/2 (RFC 7540 §8.1.2) forbids line folding in headers
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; connect-src 'self' https://api.example-site.com wss://api.example-site.com; media-src 'self' data: blob:; object-src 'none'; frame-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

# Only add_header directives belong in this file: it is included at server
# level and every location inherits from it. File access restrictions live in
# snippets/deny-files.conf (include it in the server block).
